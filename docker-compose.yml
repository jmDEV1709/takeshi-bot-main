services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jm-bot:latest
    container_name: jm-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROMIUM_PATH: /usr/bin/chromium
    volumes:
      # WhatsApp multi-file authentication; preserves the QR/login session.
      - ./assets/auth/baileys:/app/assets/auth/baileys
      # JSON persistence used by the bot.
      - ./database:/app/database
      # Temporary media and runtime logs.
      - ./assets/temp:/app/assets/temp
      # Optional YouTube cookies; place cookies/cookies.txt locally if needed.
      - ./cookies:/app/cookies:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
